<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Rishabh Sikarwar for projects, collaboration and internship opportunities.">

    <meta name="author"
          content="Rishabh Sikarwar">

    <meta name="robots"
          content="index, follow">

    <title>Contact | Rishabh Sikarwar</title>

    <link rel="stylesheet" href="css/style.css">

    <script defer src="js/script.js"></script>

</head>


<body>

<a class="skip-link" href="#main-content">
    Skip to main content
</a>


<header class="site-header">

    <div class="container header-inner">

        <a href="index.html"
           class="logo"
           aria-label="Rishabh Sikarwar Home">

            Rishabh<span>.</span>

        </a>


        <button
            class="menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="primary-nav">

            Menu

        </button>


        <nav id="primary-nav"
             aria-label="Primary navigation">

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="projects.html">
                        Projects
                    </a>
                </li>

                <li>
                    <a href="contact.html"
                       aria-current="page">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</header>


<main id="main-content">

    <section class="section"
             aria-labelledby="contact-title">

        <div class="container narrow">

            <p class="eyebrow">
                Get In Touch
            </p>


            <h1 id="contact-title">
                Contact Me
            </h1>


            <p>
                Use the form below for project discussions,
                collaboration or internship opportunities.
            </p>


            <form id="contact-form"
                  class="contact-form"
                  novalidate
                  aria-describedby="form-help">


                <p id="form-help"
                   class="form-help">

                    All fields marked with
                    <span aria-hidden="true">*</span>
                    are required.

                </p>


                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full name
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        autocomplete="name"
                        required
                        aria-required="true">

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email address
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        aria-required="true">

                </div>


                <!-- Subject -->

                <div class="form-group">

                    <label for="subject">
                        Subject
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        id="subject"
                        name="subject"
                        type="text"
                        required
                        aria-required="true">

                </div>


                <!-- Message -->

                <div class="form-group">

                    <label for="message">
                        Message
                        <span aria-hidden="true">*</span>
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        required
                        aria-required="true">
                    </textarea>

                </div>


                <button
                    class="button"
                    type="submit">

                    Send Message

                </button>


                <!-- Screen reader friendly status -->

                <p
                    id="form-status"
                    class="status"
                    role="status"
                    aria-live="polite">
                </p>

            </form>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container">

        <p>
            &copy;
            <span id="year"></span>
            Rishabh Sikarwar.
        </p>

    </div>

</footer>

</body>
</html>
